<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | Issue Report System</title>
  <link rel="icon" type="image/png" href="images/logoweb.png">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-container">
    <header class="login-header">
      <img src="images/logo.png" alt="KFT Company Logo" width="150">
      <h1>Issue Report System</h1>
      <p>Kotobukiya Feltol (Thailand) Co.,Ltd</p>
    </header>

    <section class="login-section">
      <h2>เข้าสู่ระบบ</h2>
      <p>กรุณาเข้าสู่ระบบเพื่อแจ้งปัญหา</p>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="กรอก Username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="กรอก Password" autocomplete="current-password" required>
        </div>
        <div class="form-actions">
          <button type="submit" id="loginButton" class="submit-button">เข้าสู่ระบบ</button>
        </div>
      </form>
    </section>

    <footer class="login-footer">
      <p>IT Support • Kotobukiya Feltol (Thailand) Co.,Ltd</p>
    </footer>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
