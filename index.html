<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Issue Report System</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logoweb.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-container">

        <!-- ส่วนหัวระบบ -->
        <header class="login-header">
            <img src="images/logo.png" alt="KFT Company Logo" class="logo" width="150">
            <h1>Issue Report System</h1>
            <p>Kotobukiya Feltol (Thailand) Co.,Ltd</p>
        </header>

        <!-- Login Form -->
        <section class="login-section">
            <h2>เข้าสู่ระบบ</h2>
            <p>กรุณาเข้าสู่ระบบเพื่อแจ้งปัญหา</p>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="กรอก Username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="กรอก Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" id="loginButton" class="submit-button">
                        เข้าสู่ระบบ
                    </button>
                </div>
            </form>
        </section>

        <!-- Footer -->
        <footer class="login-footer">
            <p>IT Support • Kotobukiya Feltol (Thailand) Co.,Ltd</p>
        </footer>

    </main>

    <!-- JS -->
    <script src="js/login.js"></script>
</body>
</html>
