<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>แจ้งปัญหา | Issue Report System</title>

    <!-- สำคัญมาก:
         report.html อยู่ใน pages/
         ดังนั้นต้องใช้ ../ เพื่อย้อนกลับไปโฟลเดอร์หลัก -->
    <link rel="stylesheet" href="../css/report.css">
    <link rel="stylesheet" href="../css/logout.css">
</head>

<body>

    <!-- =========================
         Header
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="report.html" class="brand">

                <!-- รูปอยู่ที่ images/logo.png -->
                <img
                    src="../images/logo.png"
                    alt="KFT Company Logo"
                    class="company-logo"
                >

                <div class="brand-text">
                    <h1>Issue Report System</h1>
                    <p>ระบบแจ้งปัญหาภายในองค์กร</p>
                </div>

            </a>

            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                ออกจากระบบ
            </button>

        </div>

    </header>


    <!-- =========================
         Main
    ========================== -->
    <main class="page-container">


        <!-- =========================
             User Information
        ========================== -->
        <section class="user-card">

            <div class="user-info">

                <div class="info-item">
                    <span class="info-label">
                        ผู้ใช้งาน
                    </span>

                    <strong id="currentUser">
                        -
                    </strong>
                </div>


                <div class="info-item">
                    <span class="info-label">
                        แผนก
                    </span>

                    <strong id="currentDepartment">
                        -
                    </strong>
                </div>

            </div>

        </section>


        <!-- =========================
             Report Form
        ========================== -->
        <section class="report-card">

            <div class="report-header">

                <h2>
                    แจ้งปัญหา
                </h2>

                <p>
                    กรุณากรอกรายละเอียดของปัญหาที่พบ
                </p>

            </div>


            <!-- Error Message -->
            <div
                id="errorMessage"
                class="message error-message"
                style="display:none;"
            ></div>


            <!-- Success Message -->
            <div
                id="successMessage"
                class="message success-message"
                style="display:none;"
            ></div>


            <!-- =========================
                 Form
            ========================== -->
            <form id="reportForm">

                <!-- หัวข้อ -->
                <div class="form-group">

                    <label for="subject">
                        หัวข้อปัญหา
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="เช่น เครื่องพิมพ์ใช้งานไม่ได้"
                        required
                    >

                </div>


                <!-- ประเภทปัญหา -->
                <div class="form-group">

                    <label for="problemType">
                        ประเภทปัญหา
                        <span class="required">*</span>
                    </label>

                    <select
                        id="problemType"
                        name="problemType"
                        required
                    >

                        <option value="">
                            -- เลือกประเภทปัญหา --
                        </option>

                        <option value="คอมพิวเตอร์">
                            คอมพิวเตอร์
                        </option>

                        <option value="เครื่องพิมพ์">
                            เครื่องพิมพ์
                        </option>

                        <option value="ระบบเครือข่าย">
                            ระบบเครือข่าย
                        </option>

                        <option value="โปรแกรม">
                            โปรแกรม
                        </option>

                        <option value="ระบบอินเทอร์เน็ต">
                            ระบบอินเทอร์เน็ต
                        </option>

                        <option value="อุปกรณ์สำนักงาน">
                            อุปกรณ์สำนักงาน
                        </option>

                        <option value="อื่น ๆ">
                            อื่น ๆ
                        </option>

                    </select>

                </div>


                <!-- รายละเอียด -->
                <div class="form-group">

                    <label for="description">
                        รายละเอียดปัญหา
                        <span class="required">*</span>
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="6"
                        placeholder="กรุณาอธิบายอาการหรือปัญหาที่พบ"
                        required
                    ></textarea>

                </div>


                <!-- สถานที่ -->
                <div class="form-group">

                    <label for="location">
                        สถานที่ / จุดที่พบปัญหา
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="เช่น ห้อง GAD, Production 1"
                        required
                    >

                </div>


                <!-- Asset -->
                <div class="form-group">

                    <label for="assetNumber">
                        หมายเลขทรัพย์สิน / รหัสเครื่อง
                        <span class="optional">
                            (ถ้ามี)
                        </span>
                    </label>

                    <input
                        type="text"
                        id="assetNumber"
                        name="assetNumber"
                        placeholder="เช่น KFT-PC-001"
                    >

                </div>


                <!-- รูปภาพ -->
                <div class="form-group">

                    <label for="image">
                        รูปภาพประกอบ
                        <span class="optional">
                            (ถ้ามี)
                        </span>
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <small class="help-text">
                        รองรับไฟล์รูปภาพ เช่น JPG, PNG และ WEBP
                    </small>

                </div>


                <!-- ปุ่ม -->
                <div class="form-actions">

                    <button
                        type="submit"
                        id="submitButton"
                        class="submit-button"
                    >
                        <span id="submitButtonText">
                            ➤ &nbsp;ส่งแจ้งปัญหา
                        </span>
                    </button>


                    <button
                        type="reset"
                        id="resetButton"
                        class="reset-button"
                    >
                        ล้างข้อมูล
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================
         JavaScript
    ========================== -->

    <!-- ต้องอยู่ก่อน report.js -->
    <script src="../js/auth.js"></script>

    <script>
        /*
         * ตรวจสอบ Login
         */
        document.addEventListener("DOMContentLoaded", function () {

            if (typeof checkLogin === "function") {
                checkLogin();
            }

        });
    </script>

    <!-- Report JavaScript -->
    <script src="../js/report.js"></script>

</body>

</html>
