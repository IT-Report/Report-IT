<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>แจ้งปัญหา | Issue Report System</title>

    <link rel="stylesheet" href="../css/report.css">
</head>

<body>

    <!-- ==============================
         Header
    =============================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="report.html" class="brand">

                <img
                    src="../images/logo.png"
                    alt="KFT Company Logo"
                    class="company-logo"
                >

                <div class="brand-text">
                    <h1>Issue Report System</h1>

                    <p>
                        ระบบแจ้งปัญหาภายในองค์กร
                    </p>
                </div>

            </a>

            <button
                type="button"
                class="logout-button"
                onclick="logout()"
            >
                ออกจากระบบ
            </button>

        </div>

    </header>


    <!-- ==============================
         Main
    =============================== -->
    <main class="main-container">


        <!-- ==============================
             User Information
        =============================== -->
        <section class="user-card">

            <div class="user-info">

                <span class="info-label">
                    ผู้ใช้งาน
                </span>

                <strong
                    id="currentUser"
                    class="info-value"
                >
                    -
                </strong>

            </div>


            <div class="user-info">

                <span class="info-label">
                    แผนก
                </span>

                <strong
                    id="currentDepartment"
                    class="info-value"
                >
                    -
                </strong>

            </div>

        </section>


        <!-- ==============================
             Report Form
        =============================== -->
        <section class="report-card">

            <div class="report-header">

                <h2>
                    แจ้งปัญหา
                </h2>

                <p>
                    กรุณากรอกรายละเอียดของปัญหาที่พบ
                </p>

            </div>


            <!-- Error Message -->
            <div
                id="errorMessage"
                class="message error-message"
                style="display:none;"
            ></div>


            <!-- Success Message -->
            <div
                id="successMessage"
                class="message success-message"
                style="display:none;"
            ></div>


            <!-- ==============================
                 Form
            =============================== -->
            <form
                id="reportForm"
                novalidate
            >


                <!-- ==============================
                     Subject
                =============================== -->
                <div class="form-group">

                    <label for="subject">
                        หัวข้อปัญหา
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="เช่น เครื่องพิมพ์ใช้งานไม่ได้"
                        required
                    >

                </div>


                <!-- ==============================
                     Problem Type
                =============================== -->
                <div class="form-group">

                    <label for="problemType">
                        ประเภทปัญหา
                        <span class="required">*</span>
                    </label>

                    <select
                        id="problemType"
                        name="problemType"
                        required
                    >

                        <option value="">
                            -- เลือกประเภทปัญหา --
                        </option>

                        <option value="คอมพิวเตอร์">
                            คอมพิวเตอร์
                        </option>

                        <option value="เครื่องพิมพ์">
                            เครื่องพิมพ์
                        </option>

                        <option value="ระบบเครือข่าย">
                            ระบบเครือข่าย
                        </option>

                        <option value="โปรแกรม">
                            โปรแกรม
                        </option>

                        <option value="ระบบสารสนเทศ">
                            ระบบสารสนเทศ
                        </option>

                        <option value="อุปกรณ์สำนักงาน">
                            อุปกรณ์สำนักงาน
                        </option>

                        <option value="อื่นๆ">
                            อื่นๆ
                        </option>

                    </select>

                </div>


                <!-- ==============================
                     Description
                =============================== -->
                <div class="form-group">

                    <label for="description">
                        รายละเอียดปัญหา
                        <span class="required">*</span>
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="6"
                        placeholder="กรุณาอธิบายอาการหรือปัญหาที่พบ"
                        required
                    ></textarea>

                </div>


                <!-- ==============================
                     Location
                =============================== -->
                <div class="form-group">

                    <label for="location">
                        สถานที่ / จุดที่พบปัญหา
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="เช่น ห้อง GAD, Production 1"
                        required
                    >

                </div>


                <!-- ==============================
                     Asset Number
                =============================== -->
                <div class="form-group">

                    <label for="assetNumber">
                        หมายเลขทรัพย์สิน / รหัสเครื่อง
                        <span class="optional">
                            (ถ้ามี)
                        </span>
                    </label>

                    <input
                        type="text"
                        id="assetNumber"
                        name="assetNumber"
                        placeholder="เช่น KFT-PC-001"
                    >

                </div>


                <!-- ==============================
                     Image
                =============================== -->
                <div class="form-group">

                    <label for="image">
                        รูปภาพประกอบ
                        <span class="optional">
                            (ถ้ามี)
                        </span>
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <small class="help-text">
                        รองรับไฟล์รูปภาพ เช่น JPG, PNG และ WEBP
                    </small>

                </div>


                <!-- ==============================
                     Buttons
                =============================== -->
                <div class="form-actions">

                    <button
                        type="submit"
                        id="submitButton"
                        class="submit-button"
                    >
                        <span id="submitText">
                            ➤ &nbsp; ส่งแจ้งปัญหา
                        </span>
                    </button>


                    <button
                        type="reset"
                        id="resetButton"
                        class="reset-button"
                    >
                        ล้างข้อมูล
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- ==============================
         JavaScript
    =============================== -->

    <script src="../js/auth.js"></script>

    <script>
        /*
         * ตรวจสอบ Login
         */
        checkLogin();


        /*
         * แสดงข้อมูลผู้ใช้งาน
         */
        document.addEventListener("DOMContentLoaded", function () {

            const user = getCurrentUser();

            if (!user) {
                return;
            }

            const userElement =
                document.getElementById("currentUser");

            const departmentElement =
                document.getElementById("currentDepartment");


            if (userElement) {
                userElement.textContent =
                    user.username || "-";
            }


            if (departmentElement) {
                departmentElement.textContent =
                    user.department || "-";
            }

        });
    </script>


    <script src="../js/report.js"></script>

</body>

</html>
