<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>แจ้งปัญหา | Issue Report System</title>

    <!-- สำคัญ: report.html อยู่ใน pages จึงต้องใช้ ../ -->
    <link rel="stylesheet" href="../css/report.css">
    <link rel="stylesheet" href="../css/logout.css">
</head>

<body>

    <!-- =========================
         Header
    ========================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="report.html" class="brand">

                <img
                    src="../images/logo.png"
                    alt="KFT Company Logo"
                    class="company-logo"
                >

                <div class="brand-text">

                    <h1>Issue Report System</h1>

                    <p>
                        ระบบแจ้งปัญหาภายในองค์กร
                    </p>

                </div>

            </a>

            <div class="header-right">

                <button
                    type="button"
                    id="logoutButton"
                    class="logout-button"
                    onclick="logout()"
                >
                    ออกจากระบบ
                </button>

            </div>

        </div>

    </header>


    <!-- =========================
         User Information
    ========================== -->
    <section class="user-info-section">

        <div class="user-info-card">

            <div class="user-info-item">

                <span class="info-label">
                    ผู้ใช้งาน
                </span>

                <strong id="currentUser">
                    -
                </strong>

            </div>


            <div class="user-info-item">

                <span class="info-label">
                    แผนก
                </span>

                <strong id="currentDepartment">
                    -
                </strong>

            </div>

        </div>

    </section>


    <!-- =========================
         Main
    ========================== -->
    <main class="main-container">

        <section class="report-card">

            <div class="report-header">

                <h2>
                    แจ้งปัญหา
                </h2>

                <p>
                    กรุณากรอกรายละเอียดของปัญหาที่พบ
                </p>

            </div>


            <!-- =========================
                 Message
            ========================== -->
            <div
                id="message"
                class="message"
                style="display:none;"
            ></div>


            <!-- =========================
                 Report Form
            ========================== -->
            <form
                id="reportForm"
                enctype="multipart/form-data"
            >

                <!-- หัวข้อปัญหา -->
                <div class="form-group">

                    <label for="subject">
                        หัวข้อปัญหา
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="เช่น เครื่องพิมพ์ใช้งานไม่ได้"
                        required
                    >

                </div>


                <!-- ประเภทปัญหา -->
                <div class="form-group">

                    <label for="problemType">
                        ประเภทปัญหา
                        <span class="required">*</span>
                    </label>

                    <select
                        id="problemType"
                        name="problemType"
                        required
                    >

                        <option value="">
                            -- เลือกประเภทปัญหา --
                        </option>

                        <option value="คอมพิวเตอร์">
                            คอมพิวเตอร์
                        </option>

                        <option value="เครื่องพิมพ์">
                            เครื่องพิมพ์
                        </option>

                        <option value="ระบบเครือข่าย">
                            ระบบเครือข่าย
                        </option>

                        <option value="โปรแกรม">
                            โปรแกรม
                        </option>

                        <option value="อุปกรณ์สำนักงาน">
                            อุปกรณ์สำนักงาน
                        </option>

                        <option value="อื่นๆ">
                            อื่นๆ
                        </option>

                    </select>

                </div>


                <!-- รายละเอียด -->
                <div class="form-group">

                    <label for="description">
                        รายละเอียดปัญหา
                        <span class="required">*</span>
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="6"
                        placeholder="กรุณาอธิบายอาการหรือปัญหาที่พบ"
                        required
                    ></textarea>

                </div>


                <!-- สถานที่ -->
                <div class="form-group">

                    <label for="location">
                        สถานที่ / จุดที่พบปัญหา
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="เช่น ห้อง GAD, Production 1"
                        required
                    >

                </div>


                <!-- รหัสเครื่อง -->
                <div class="form-group">

                    <label for="assetNumber">
                        หมายเลขทรัพย์สิน / รหัสเครื่อง
                        <span class="optional">
                            (ถ้ามี)
                        </span>
                    </label>

                    <input
                        type="text"
                        id="assetNumber"
                        name="assetNumber"
                        placeholder="เช่น KFT-PC-001"
                    >

                </div>


                <!-- รูปภาพ -->
                <div class="form-group">

                    <label for="image">
                        รูปภาพประกอบ
                        <span class="optional">
                            (ถ้ามี)
                        </span>
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/png,image/jpeg,image/webp"
                    >

                    <small class="file-help">
                        รองรับไฟล์ JPG, PNG และ WEBP
                    </small>

                </div>


                <!-- Preview รูป -->
                <div
                    id="imagePreviewContainer"
                    class="image-preview-container"
                    style="display:none;"
                >

                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="ตัวอย่างรูปภาพ"
                    >

                </div>


                <!-- ปุ่ม -->
                <div class="form-actions">

                    <button
                        type="submit"
                        id="submitButton"
                        class="submit-button"
                    >
                        ส่งแจ้งปัญหา
                    </button>

                    <button
                        type="reset"
                        id="resetButton"
                        class="reset-button"
                    >
                        ล้างข้อมูล
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================
         Footer
    ========================== -->
    <footer class="site-footer">

        <p>
            IT Support • Kotobukiya Feltol (Thailand) Co.,Ltd
        </p>

    </footer>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="../js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            if (typeof checkLogin === "function") {
                checkLogin();
            }

            if (typeof getCurrentUser === "function") {

                const user = getCurrentUser();

                if (user) {

                    const usernameElement =
                        document.getElementById("currentUser");

                    const departmentElement =
                        document.getElementById("currentDepartment");


                    if (usernameElement) {
                        usernameElement.textContent =
                            user.username ||
                            user.user ||
                            "-";
                    }


                    if (departmentElement) {
                        departmentElement.textContent =
                            user.department ||
                            "-";
                    }

                }

            }

        });
    </script>


    <script src="../js/report.js"></script>


    <!-- Preview รูปภาพ -->
    <script>

        const imageInput =
            document.getElementById("image");

        const imagePreview =
            document.getElementById("imagePreview");

        const imagePreviewContainer =
            document.getElementById("imagePreviewContainer");


        if (imageInput) {

            imageInput.addEventListener("change", function () {

                const file = this.files[0];

                if (!file) {

                    imagePreviewContainer.style.display = "none";

                    imagePreview.src = "";

                    return;
                }


                if (!file.type.startsWith("image/")) {

                    imagePreviewContainer.style.display = "none";

                    imagePreview.src = "";

                    return;
                }


                const reader = new FileReader();


                reader.onload = function (event) {

                    imagePreview.src =
                        event.target.result;

                    imagePreviewContainer.style.display =
                        "block";

                };


                reader.readAsDataURL(file);

            });

        }


        const reportForm =
            document.getElementById("reportForm");


        if (reportForm) {

            reportForm.addEventListener("reset", function () {

                setTimeout(function () {

                    if (imagePreviewContainer) {
                        imagePreviewContainer.style.display =
                            "none";
                    }

                    if (imagePreview) {
                        imagePreview.src = "";
                    }

                }, 0);

            });

        }

    </script>

</body>

</html>
